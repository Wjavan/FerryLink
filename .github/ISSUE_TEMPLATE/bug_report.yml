name: Bug 反馈
description: 脚本在某个网盘页面不工作、报错或下载失败
title: '[Bug] '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        只反馈 FerryLink 本身的问题。怀疑和其他脚本或扩展冲突时，请先停用其他脚本再试一遍。
  - type: checkboxes
    id: confirm
    attributes:
      label: 确认
      options:
        - label: 已在最新版本中复现该问题
          required: true
        - label: 停用其他脚本后该问题仍可复现
          required: false
  - type: textarea
    id: page
    attributes:
      label: 页面地址
      description: 出问题的页面完整 URL。
    validations:
      required: true
  - type: dropdown
    id: provider
    attributes:
      label: 受影响网盘
      description: 涉及多家时选主要的那家，其余写在现象里。
      options:
        - 百度网盘
        - 阿里云盘
        - 天翼云盘
        - 迅雷云盘
        - 夸克网盘
        - 移动云盘
        - 城通网盘
        - 其他 / 不确定
    validations:
      required: false
  - type: input
    id: env
    attributes:
      label: 浏览器与脚本管理器
      description: 浏览器版本 + 管理器名称与版本。
      placeholder: Edge 138 + Tampermonkey 5.x
    validations:
      required: true
  - type: textarea
    id: symptom
    attributes:
      label: 现象
      description: 点了什么、期望发生什么、实际发生什么。
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 补充信息
      description: 报错文字、截图、页面上的提示，有就贴。没有就写「无」。
    validations:
      required: false
  - type: checkboxes
    id: help
    attributes:
      label: 后续配合
      options:
        - label: 愿意验证修复后的版本，或自己提 PR

