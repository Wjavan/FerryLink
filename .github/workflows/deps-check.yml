name: Deps Check

# 依赖清单只有脚本头一个出处：这里照着它逐个下载核对，不在别处另抄一份。
# 没有 deps.lock 就按本次结果生成基线；地址增删只提示不拦；连不上直接红。

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deps:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: 逐个下载核对
        shell: bash
        run: |
          set -u
          SRC='网盘直链下载助手.user.js'
          LOCK='.github/deps.lock'

          declare -A PIN=()
          if [ -f "$LOCK" ]; then
            while read -r u s; do
              case "$u" in ''|'#'*) continue ;; esac
              PIN["$u"]="$s"
            done < <(tr -d '\r' < "$LOCK")
          fi

          mapfile -t urls < <(grep -E '^// *@require[[:space:]]+https?://' "$SRC" \
            | awk '{print $NF}' | tr -d '\r' | sort -u)
          if [ "${#urls[@]}" -eq 0 ]; then echo 'FAIL  脚本头里没抽到依赖'; exit 1; fi

          fail=0; warn=0
          declare -A GOT=()
          for u in "${urls[@]}"; do
            tmp="${RUNNER_TEMP:-/tmp}/dep-$$-${RANDOM}.bin"
            meta=$(curl -sSL --retry 3 --retry-all-errors --retry-delay 2 \
                   --connect-timeout 10 --max-time 40 -o "$tmp" \
                   -w '%{http_code}|%{content_type}' "$u" || true)
            code=${meta%%|*}; ctype=${meta#*|}
            [ -n "$code" ] || code=000
            size=$([ -f "$tmp" ] && wc -c < "$tmp" || echo 0)
            name=$(basename "${u%%\?*}")
            v=$(sed -nE 's#.*/([0-9]+\.[0-9]+\.[0-9]+)/.*#\1#p' <<<"$u")

            if [ "$code" != 200 ]; then
              echo "FAIL  $name  HTTP $code"; fail=$((fail + 1)); rm -f "$tmp"; continue
            fi
            if [ "$size" -lt 1000 ]; then
              echo "FAIL  $name  只有 $size 字节，像错误页"; fail=$((fail + 1)); rm -f "$tmp"; continue
            fi
            case "$ctype" in
              *html*)
                echo "FAIL  $name  返回的是网页不是文件（$ctype）"; fail=$((fail + 1)); rm -f "$tmp"; continue ;;
            esac
            if [ -n "$v" ] && ! grep -Fq -- "$v" "$tmp"; then
              echo "FAIL  $name  内容里找不到版本号 $v"; fail=$((fail + 1)); rm -f "$tmp"; continue
            fi
            GOT["$u"]=$(sha256sum "$tmp" | cut -d' ' -f1)
            printf 'OK    %-34s %-9s %8s 字节\n' "$name" "${v:-–}" "$size"
            rm -f "$tmp"
          done
          [ "$fail" -eq 0 ] || { echo "依赖 ${#urls[@]} 个，失败 $fail"; exit 1; }

          # 没锁：按这次的结果生成基线，贴进 .github/deps.lock 即可
          if [ ! -f "$LOCK" ]; then
            echo "WARN  没有 $LOCK，按本次结果生成基线（复制下面几行提交）"
            lines=''
            for u in "${urls[@]}"; do
              lines+="$u ${GOT[$u]}"$'\n'
            done
            printf '%s' "$lines"
            if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
              { echo '## 依赖基线（新建 .github/deps.lock）'; echo '```'; printf '%s' "$lines"; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
            fi
            echo "依赖 ${#urls[@]} 个，无基线"
            exit 0
          fi

          # 有锁：地址增删只提示；地址没变但内容变了才算被替换
          for u in "${urls[@]}"; do
            name=$(basename "${u%%\?*}")
            want="${PIN[$u]:-}"
            if [ -z "$want" ]; then
              echo "WARN  $name  新增依赖，基线里没有（补一行：$u ${GOT[$u]}）"; warn=$((warn + 1))
            elif [ "$want" != "${GOT[$u]}" ]; then
              echo "FAIL  $name  地址没变但内容变了（期望 ${want:0:16}… 实际 ${GOT[$u]:0:16}…）"
              fail=$((fail + 1))
            fi
          done
          for u in "${!PIN[@]}"; do
            hit=0
            for x in "${urls[@]}"; do [ "$x" = "$u" ] && { hit=1; break; }; done
            if [ "$hit" -eq 0 ]; then
              echo "WARN  基线里有、脚本头已不要：$u"; warn=$((warn + 1))
            fi
          done

          echo "依赖 ${#urls[@]} 个，失败 $fail，提示 $warn"
          [ "$fail" -eq 0 ]
